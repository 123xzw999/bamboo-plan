<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竹略 · 长期计划与实现分布</title>
<meta name="description" content="竹略 —— 长期计划与实现分布：立总纲、分枝节、育想法、看分布。">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="locked">

<!-- 底部竹林（随主题与页面换景，分段异相摆动） -->
<div class="bamboo" data-scene="1" data-t="light" aria-hidden="true">
  <div class="bamboo__band" id="bambooBand">
    <i style="--l:0%;--r:55%;--dur:9.6s;--del:0s;--amp:.55deg"></i>
    <i style="--l:27%;--r:28%;--dur:11.4s;--del:-2.6s;--amp:.78deg"></i>
    <i style="--l:55%;--r:0%;--dur:8.3s;--del:-5.1s;--amp:.62deg"></i>
  </div>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="seal">竹</span>
      <div class="brand__txt">
        <p class="brush brand__name">竹略</p>
        <p class="brand__sub">长期计划 · 实现分布</p>
      </div>
    </div>

    <nav class="nav">
      <button class="nav__item" data-act="nav" data-view="home">
        <svg class="nav__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 9.5h7M8.5 13h7M8.5 16.5h4"/></svg>
        <span class="nav__label">总览</span>
        <span class="nav__motto">根深方能叶茂</span>
      </button>
      <button class="nav__item" data-act="nav" data-view="strategy">
        <svg class="nav__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5V9"/><path d="M12 9C12 6.2 9.4 5 6 5"/><path d="M12 9c0-2.8 2.6-4 6-4"/><circle cx="12" cy="20.5" r="1.1"/></svg>
        <span class="nav__label">战略</span>
        <span class="nav__motto">谋定而后动</span>
      </button>
      <button class="nav__item" data-act="nav" data-view="ideas">
        <svg class="nav__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4c-9.2 0-14 5-14 12 0 2 1 4 1 4s7 0 10-4c3-4 3-12 3-12Z"/><path d="M6 20c3-4 6-7 11-9"/></svg>
        <span class="nav__label">想法</span>
        <span class="nav__motto">风过竹林，留声</span>
      </button>
      <button class="nav__item" data-act="nav" data-view="dist">
        <svg class="nav__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v8h8"/></svg>
        <span class="nav__label">分布</span>
        <span class="nav__motto">因地制宜，因时制宜</span>
      </button>
    </nav>

    <div class="sidebar__foot">
      <div class="theme-seg">
        <button data-act="theme" data-theme="auto">自动</button>
        <button data-act="theme" data-theme="light">亮</button>
        <button data-act="theme" data-theme="dark">暗</button>
      </div>
      <div class="foot-acts">
        <button class="btn btn--ghost btn--sm" data-act="export">导出</button>
        <button class="btn btn--ghost btn--sm" data-act="import">导入</button>
        <button class="btn btn--ghost btn--sm" data-act="logout">退出</button>
      </div>
      <input id="importFile" type="file" accept="application/json" hidden>
      <p class="foot-note">数据只存在此机浏览器中</p>
    </div>
  </aside>

  <main class="main">
    <div id="view"></div>
    <p class="main__foot" id="viewSeg"></p>
  </main>
</div>

<!-- 入园门帘 -->
<div class="gate" id="gate">
  <form class="gate__card" id="gateForm" autocomplete="off">
    <span class="seal seal--lg">竹</span>
    <h1 class="brush gate__title">竹略</h1>
    <p class="gate__sub">向下生发，向上坚韧</p>
    <label class="field">
      <span class="field__label">名号</span>
      <input id="gateUser" type="text" inputmode="numeric" placeholder="请输入名号">
    </label>
    <label class="field">
      <span class="field__label">口令</span>
      <input id="gatePass" type="password" placeholder="请输入口令">
    </label>
    <p class="gate__err" id="gateErr"></p>
    <button class="btn btn--jade btn--block" type="submit">入 园</button>
  </form>
</div>

<div class="modal" id="modal"></div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
